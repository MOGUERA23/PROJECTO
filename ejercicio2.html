<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promedio de calificaciones</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <td colspan="4" align="center" bgcolor="#cccccc">promedio de calificaciones</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nota:</td>
                <td><input type="number" id="txtNota" step="any"></td>
                <td>Tope: 12</td>
                <td><button id="btnAgregar">Agregar Nota</button></td>
            </tr>
            <tr>
                <td></td>
                <td><textarea id="txtListado" rows="9" cols="30" placeholder="listado de notas" readonly></textarea></td>
                <td><button id="btnPresentar">Presentar</button></td>
                <td><button id="btnCargar">Cargar Notas</button></td>
            </tr>
            <tr>
                <td>Promedio</td>
                <td><input type="text" id="txtPromedio" placeholder="0.00" readonly></td>
                <td><button id="btnCalcular">Calcular</button></td>
                <td></td>
            </tr>
            <tr>
                <td>Aprobados</td>
                <td><input type="text" id="txtAprobados" readonly></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Reprobados</td>
                <td><input type="text" id="txtReprobados" readonly></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <script>
        // Vector donde se guardan las notas (maximo 12)
        let notas = [];
        const TOPE = 12;

        // Guarda el dato escrito en el vector
        function agregarNota() {
            let valor = parseFloat(document.getElementById("txtNota").value);
            if (isNaN(valor) || valor < 0 || valor > 10) {
                alert("La nota debe estar entre 0 y 10");
                return;
            }
            if (notas.length >= TOPE) {
                alert("Ya ingreso las 12 notas");
                return;
            }
            notas.push(valor);
            document.getElementById("txtNota").value = "";
        }

        // Llena el vector con datos de ejemplo usando un for
        function cargarNotas() {
            let ejemplo = [8, 6.5, 9, 7, 5, 10, 4, 7.5, 8.5, 6, 9.5, 7];
            notas = [];
            for (let i = 0; i < TOPE; i++) {
                notas.push(ejemplo[i]);
            }
        }

        // FOR 1: recorre el vector y arma el listado
        function presentar() {
            let texto = "";
            for (let i = 0; i < notas.length; i++) {
                texto += "Estudiante " + (i + 1) + ": " + notas[i] + "\n";
            }
            document.getElementById("txtListado").value = texto;
        }

        // FOR 2: suma las notas y cuenta aprobados (>= 7) y reprobados
        function calcular() {
            if (notas.length < TOPE) {
                alert("Faltan notas: ingrese las 12");
                return;
            }
            let suma = 0;
            let aprobados = 0;
            let reprobados = 0;
            for (let i = 0; i < notas.length; i++) {
                suma = suma + notas[i];
                if (notas[i] >= 7) {
                    aprobados++;
                } else {
                    reprobados++;
                }
            }
            document.getElementById("txtPromedio").value = (suma / notas.length).toFixed(2);
            document.getElementById("txtAprobados").value = aprobados;
            document.getElementById("txtReprobados").value = reprobados;
        }

        document.getElementById("btnAgregar").addEventListener("click", agregarNota);
        document.getElementById("btnPresentar").addEventListener("click", presentar);
        document.getElementById("btnCargar").addEventListener("click", cargarNotas);
        document.getElementById("btnCalcular").addEventListener("click", calcular);
    </script>
</body>
</html>
