<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario</title>
</head>
<body>
    <table border="">
        <th colspan="4">
            <tr>
                <td colspan="5" align="center">Control de Inventario</td>
            </tr>
        </th>
        <tbody>
            <tr>
                <td>Precio</td>
                <td><input type="number" id="txt-precio"></td>
                <td>Tope: 6 </td>
                <td>
                    <button type="" id="btn-agregar-precio">agregar</button>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <textarea name="" id="txt-listado-precios" placeholder="listado de precios" rows="5"  readonly ></textarea>
                </td>
                <td>
                    <button type="" id="btn-presentar-precios">Presentar</button>
                </td>
                <td>
                    <button type="" id="btn-cargar-precios" align="center">Cargar precios</button>
                </td>
                </td>
            </tr>
            <tr>
                <td>Total Inv</td>
                <td>
                    <input type="text" readonly placeholder="$0.00" id="txt-total-inventario">
                </td>
                <td>
                    <button id="btn-calcular-total" type="">Calcular total</button>
                </td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <script>
        //
        const txtPrecio = document.getElementById('txt-precio');
        const btnAgregarPrecio = document.getElementById('btn-agregar-precio');

        const txtlistadoPrecio = document.getElementById('txt-listado-precios')
        const btnPresentarPrecio = document.getElementById('btn-presentar-precios')
        
        const txtTotalInventario = document.getElementById('txt-total-inventario');
        const btnCalcularTotal = document.getElementById('btn-calcular-total');

        
        const TOPE = 6;
        // Definir el vector
        let productos = []; // new Array()
        
        //Agregar evento escuchador Click agregar
        btnAgregarPrecio.addEventListener('click', function(e){
            // Extraer precio de la caja de texto
            const precio = parseFloat(txtPrecio.value);
            //Calcular la cantidad de elementos del vector
            const cantElementos = productos.length;
            // Mientras cantElementos sea menor al TOPE=6 continuo agregando precios
            if(cantElementos < TOPE){
                const indice = cantElementos;
                //Asignar o agregar el nuevo precio
                productos[indice] = precio;
                // presentar por consola el vector
                console.log('productos:', productos);
                txtPrecio.value = '';
                
            }
            else{
                alert('Ya no se puede ingresar precios..')
            };
        })

        // agregar evento escuychador click presentar
        btnPresentarPrecio.addEventListener('click', function(e){
            //borramos datos en la caja de texto
            txtlistadoPrecio.value = '';
            //txtlistadoPrecio.value = productos.join('\n')
            for(let i = 0; i < productos.length; i++){
                // agregamos valores a la caja de texto
                txtlistadoPrecio.value += productos[i] + '\n' 
            }
        })
    
        btnCalcularTotal.addEventListener('click', function(e){
            txtTotalInventario.value = fnCalcularTotal().toFixed(2)
        })

        function fnCalcularTotal(){
            let totalInventario = 0 // acumulador

            for(let i = 0; i < productos.length; i++){
                totalInventario = totalInventario + productos[i]
            }
            return totalInventario;
        }

    </script>
</body>
</html>
